[project]
name = "custom-data-toolkit"
version = "1.0.0.dev0"
requires-python = ">=3.12"
dependencies = [
    "pymysql>=1.1,<2",
    "cryptography>=42,<47",
    "alembic>=1.14,<2",
    "fastapi>=0.130,<1",
    "sqlmodel>=0.0.38,<1",
    "uvicorn>=0.40,<1",
    "pydantic-settings>=2.0,<3",
    "argon2-cffi>=23.1,<26",
    "redis>=8.1.0",
]

[dependency-groups]
dev = [
    "ruff>=0.15",
]
test = [
    "pytest>=9.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "pytest-cov>=5.0",
    "fakeredis>=2.37.0",
]

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src/custom_data_toolkit"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI 依赖注入允许在默认值里调用 Depends/Query/Path 等。
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.Cookie",
    "fastapi.Form",
    "fastapi.File",
    "fastapi.Security",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*" = ["S101", "PLR2004"]
"migrations/**/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src/custom_data_toolkit --cov-report=term-missing"
