# 用法见 deploy/docker/README.md
name: tendata-customs-tools

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        PYTHON_VERSION: ${PYTHON_VERSION:-3.12}
        HARBOR_REGISTRY: ${HARBOR_REGISTRY:-harbor-dev.tendata.com.cn}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
    image: cdt-backend:local
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    env_file:
      - path: ./deploy/docker/compose.env
        required: false
    environment:
      APP_NAME: ${APP_NAME:-tendata-customs-tools}
      APP_ENV: ${APP_ENV:-production}
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Shanghai}
      DEBUG: ${DEBUG:-false}
      HOST: 0.0.0.0
      PORT: 8000
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in deploy/docker/compose.env}
      REDIS_URL: ${REDIS_URL:?set REDIS_URL in deploy/docker/compose.env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-cdt_session}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-604800}
      ADMIN_BOOTSTRAP_USERNAME: ${ADMIN_BOOTSTRAP_USERNAME:-admin}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:-change-me}
      PUBLIC_API_AUTH_ENABLED: ${PUBLIC_API_AUTH_ENABLED:-true}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    restart: unless-stopped

  web:
    profiles: ["web", "full"]
    build:
      context: .
      dockerfile: web/Dockerfile
      target: runtime
    image: cdt-web:local
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  mysql:
    profiles: ["mysql", "local-deps", "full"]
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-me-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-customs_data_toolkit}
      MYSQL_USER: ${MYSQL_USER:-customs_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change-me}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - cdt-mysql-data:/var/lib/mysql
      - ./deploy/sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  redis:
    profiles: ["redis", "local-deps", "full"]
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PUBLISH_PORT:-6379}:6379"
    volumes:
      - cdt-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  cdt-mysql-data:
  cdt-redis-data:
